name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Python ${{ matrix.python-version }} quality checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python modules
        run: |
          python -m py_compile \
            app.py \
            parse_hospitals.py \
            scripts/build_hospital_icon_tiles.py \
            $(find backend data_validation evaluation tests data/symptom_disease_model -type f -name '*.py' -print)

      - name: Run tests and model smoke
        run: python -m pytest

      - name: Run provisional Safety Evaluation Set
        run: python -m evaluation.safety.evaluate_safety

      - name: Check browser JavaScript syntax
        run: node --check static/js/app.js

      - name: Regenerate data quality report
        run: python -m data_validation.validate_datasets --data-root data --output-dir data_validation

      - name: Regenerate characterization snapshot
        run: python tests/characterization/run_snapshot.py

      - name: Reject generated baseline drift
        run: |
          git diff --exit-code -- \
            data_validation/data_quality_report.json \
            data_validation/data_quality_report.md \
            tests/characterization/legacy_snapshot.json

  frontend:
    name: Frontend typecheck, boundary tests, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend boundary tests
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build
